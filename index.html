<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>RemitApp · Campo Simple</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:sans-serif;background:#0a0a0a;color:#f0f0f0;min-height:100vh;overflow-x:hidden}

  /* NAV */
  nav{display:flex;background:#111;border-bottom:1px solid #222;position:sticky;top:0;z-index:100}
  nav button{flex:1;padding:14px 8px;background:none;border:none;border-bottom:3px solid transparent;color:#666;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.03em}
  nav button.active{color:#c8f060;border-bottom-color:#c8f060}

  /* PAGES */
  .page{display:none;padding:20px;min-height:calc(100vh - 49px)}
  .page.active{display:block}

  /* TYPOGRAPHY */
  h1{font-size:26px;font-weight:800;margin-bottom:6px}
  h1 span{color:#c8f060}
  .sub{color:#888;font-size:14px;margin-bottom:24px;line-height:1.5}

  /* BUTTONS */
  .btn{width:100%;padding:18px;border-radius:14px;border:none;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:10px}
  .btn-primary{background:#c8f060;color:#0a0a0a}
  .btn-secondary{background:#1e1e1e;color:#f0f0f0;border:1px solid #333}
  .btn-green{background:#60f0a8;color:#0a0a0a}
  .btn-danger{background:none;color:#f06060;border:1px solid rgba(240,96,96,.3);padding:14px}
  .btn:active{opacity:.8}
  .btn:disabled{opacity:.4}

  /* CAMERA */
  #cam-wrap{display:none;position:relative;width:100%;margin-bottom:14px}
  #cam-video{width:100%;border-radius:14px;background:#000;display:block;max-height:60vh;object-fit:cover}
  #cam-snap{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;background:#c8f060;border:4px solid #fff;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.5)}
  #cam-snap:active{transform:translateX(-50%) scale(.93)}
  #cam-close{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.6);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}

  /* GALLERY fallback */
  #gallery-label{display:none}

  /* PREVIEW */
  #preview-wrap{display:none;margin-bottom:14px}
  #preview-img{width:100%;border-radius:14px;border:1px solid #333}

  /* SPINNER */
  #spinner{display:none;text-align:center;padding:40px 0}
  .ring{width:48px;height:48px;border-radius:50%;border:3px solid #333;border-top-color:#c8f060;animation:spin 1s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* FORM */
  #form-wrap{display:none}
  .section-title{font-size:11px;font-weight:700;color:#555;letter-spacing:.1em;text-transform:uppercase;margin:18px 0 10px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11px;color:#888;margin-bottom:5px;letter-spacing:.04em;text-transform:uppercase}
  .field input,.field textarea{width:100%;padding:12px 14px;background:#1e1e1e;border:1px solid #333;border-radius:10px;color:#f0f0f0;font-size:14px;-webkit-appearance:none}
  .field textarea{resize:none;font-family:sans-serif;line-height:1.5}
  .row{display:flex;gap:10px}
  .row .field{flex:1}

  /* ERROR */
  .err-box{background:rgba(240,96,96,.1);border:1px solid rgba(240,96,96,.3);border-radius:10px;padding:14px;color:#f06060;font-size:13px;margin-bottom:12px;display:none}

  /* LIST */
  .search{width:100%;padding:12px 14px;background:#1e1e1e;border:1px solid #333;border-radius:10px;color:#f0f0f0;font-size:14px;margin-bottom:16px;-webkit-appearance:none}
  .card{background:#141414;border:1px solid #222;border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer}
  .card:active{background:#1e1e1e}
  .card-num{font-size:16px;font-weight:700;margin-bottom:4px}
  .card-meta{font-size:12px;color:#888;margin-bottom:4px}
  .badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:100px;margin-top:6px}
  .badge.exp{background:rgba(200,240,96,.15);color:#c8f060}
  .badge.pend{background:rgba(240,200,60,.1);color:#f0c83c}
  .empty{text-align:center;padding:48px 0;color:#555;font-size:14px}

  /* DETAIL */
  .back-btn{background:none;border:none;color:#888;font-size:14px;cursor:pointer;margin-bottom:16px;padding:0}
  .detail-card{background:#141414;border:1px solid #222;border-radius:12px;overflow:hidden;margin-bottom:12px}
  .detail-title{padding:10px 16px;background:#1a1a1a;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#555;border-bottom:1px solid #222}
  .detail-row{display:flex;justify-content:space-between;padding:11px 16px;border-bottom:1px solid #1a1a1a;font-size:13px;gap:12px}
  .detail-row:last-child{border-bottom:none}
  .dk{color:#666;flex-shrink:0}
  .dv{color:#f0f0f0;text-align:right}
  .thumb{width:100%;border-radius:12px;margin-bottom:12px;border:1px solid #222}

  /* STATS */
  .stats{display:flex;gap:10px;margin-bottom:24px}
  .stat{flex:1;background:#141414;border:1px solid #222;border-radius:12px;padding:14px;text-align:center}
  .stat-n{font-size:26px;font-weight:800;color:#c8f060}
  .stat-l{font-size:11px;color:#666;margin-top:2px}

  /* TOAST */
  #toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(60px);background:#1e1e1e;border:1px solid #333;border-radius:12px;padding:12px 20px;font-size:13px;font-weight:600;white-space:nowrap;transition:transform .3s,opacity .3s;opacity:0;z-index:999}
  #toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  #toast.ok{color:#c8f060;border-color:rgba(200,240,96,.3)}
  #toast.err{color:#f06060;border-color:rgba(240,96,96,.3)}

  canvas{display:none}
</style>
</head>
<body>

<nav>
  <button class="active" onclick="showPage('home')">📷 Escanear</button>
  <button onclick="showPage('list')">📋 Historial</button>
</nav>

<!-- ══ HOME ══ -->
<div class="page active" id="page-home">
  <br>
  <h1>Escaneá el <span>remito</span></h1>
  <p class="sub">Fotografiá el remito firmado — extraemos los datos automáticamente.</p>

  <div class="stats">
    <div class="stat"><div class="stat-n" id="stat-total">0</div><div class="stat-l">Remitos</div></div>
    <div class="stat"><div class="stat-n" id="stat-exp">0</div><div class="stat-l">Exportados</div></div>
  </div>

  <!-- Botón principal: getUserMedia -->
  <button class="btn btn-primary" onclick="openCamera()">📷 Fotografiar Remito</button>

  <!-- Fallback galería: input file SIN capture -->
  <label class="btn btn-secondary" id="gallery-label" style="display:flex">
    🖼 Elegir desde galería
    <input type="file" accept="image/*" style="display:none" onchange="onGalleryFile(this)">
  </label>

  <!-- Visor de cámara en vivo -->
  <div id="cam-wrap">
    <video id="cam-video" autoplay playsinline muted></video>
    <button id="cam-snap" onclick="snapPhoto()" title="Tomar foto"></button>
    <button id="cam-close" onclick="closeCamera()">✕</button>
  </div>

  <!-- Preview de la foto tomada -->
  <div id="preview-wrap">
    <img id="preview-img" alt="Remito">
    <br><br>
    <button class="btn btn-primary" onclick="analyze()">✨ Analizar con IA</button>
    <button class="btn btn-secondary" onclick="openCamera()">📷 Sacar otra foto</button>
  </div>

  <!-- Spinner -->
  <div id="spinner">
    <div class="ring"></div>
    <div style="color:#888;font-size:14px">Claude está leyendo el remito…</div>
  </div>

  <!-- Error -->
  <div class="err-box" id="err-box"></div>

  <!-- Formulario de revisión -->
  <div id="form-wrap">
    <div class="section-title">📄 Remito</div>
    <div class="row">
      <div class="field"><label>N° Remito</label><input id="f-num" type="text"></div>
      <div class="field"><label>Fecha</label><input id="f-fecha" type="text"></div>
    </div>

    <div class="section-title">🏭 Remitente</div>
    <div class="field"><label>Razón Social</label><input id="f-rem-rs" type="text"></div>
    <div class="row">
      <div class="field"><label>CUIT</label><input id="f-rem-cuit" type="text"></div>
      <div class="field"><label>Localidad</label><input id="f-rem-loc" type="text"></div>
    </div>

    <div class="section-title">📍 Destinatario</div>
    <div class="field"><label>Razón Social</label><input id="f-dest-rs" type="text"></div>
    <div class="row">
      <div class="field"><label>CUIT</label><input id="f-dest-cuit" type="text"></div>
      <div class="field"><label>Localidad</label><input id="f-dest-loc" type="text"></div>
    </div>

    <div class="section-title">🚛 Transporte</div>
    <div class="field"><label>Transportista</label><input id="f-trans" type="text"></div>
    <div class="row">
      <div class="field"><label>Patente Camión</label><input id="f-pat-cam" type="text"></div>
      <div class="field"><label>Patente Acoplado</label><input id="f-pat-acop" type="text"></div>
    </div>

    <div class="section-title">💬 Observaciones</div>
    <div class="field"><textarea id="f-obs" rows="3"></textarea></div>

    <button class="btn btn-green" onclick="saveRemito()">💾 Guardar Remito</button>
    <div style="height:40px"></div>
  </div>
</div>

<!-- ══ LIST ══ -->
<div class="page" id="page-list">
  <br>
  <input class="search" type="text" placeholder="Buscar N°, empresa, patente…" oninput="filterList(this.value)">
  <div id="list-container"></div>
</div>

<!-- ══ DETAIL ══ -->
<div class="page" id="page-detail">
  <br>
  <button class="back-btn" onclick="showPage('list')">← Volver</button>
  <div id="detail-container"></div>
</div>

<canvas id="canvas"></canvas>
<div id="toast"></div>

<script>
// ── STATE ──
const STORE = 'remitapp_v3';
let remitos = [];
let currentImg64 = null;
let currentData = null;
let activeStream = null;
let detailId = null;

function load(){ try{ remitos = JSON.parse(localStorage.getItem(STORE)||'[]'); }catch{ remitos=[]; } }
function save(){ localStorage.setItem(STORE, JSON.stringify(remitos)); }

// ── NAV ──
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  const idx = ['home','list'].indexOf(id);
  if(idx>=0) document.querySelectorAll('nav button')[idx].classList.add('active');
  if(id==='list') renderList('');
  if(id==='home') updateStats();
  window.scrollTo(0,0);
  if(id!=='home') closeCamera();
}

// ── CAMERA (getUserMedia) ──
async function openCamera(){
  hideAll();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    activeStream = stream;
    const video = document.getElementById('cam-video');
    video.srcObject = stream;
    await video.play();
    document.getElementById('cam-wrap').style.display = 'block';
  } catch(e) {
    showErr('No se pudo abrir la cámara: ' + e.message + '. Usá la galería.');
  }
}

function closeCamera(){
  if(activeStream){ activeStream.getTracks().forEach(t=>t.stop()); activeStream=null; }
  document.getElementById('cam-wrap').style.display = 'none';
}

function snapPhoto(){
  const video = document.getElementById('cam-video');
  const canvas = document.getElementById('canvas');
  canvas.width = video.videoWidth || 1280;
  canvas.height = video.videoHeight || 720;
  canvas.getContext('2d').drawImage(video, 0, 0);
  currentImg64 = canvas.toDataURL('image/jpeg', 0.92).split(',')[1];
  closeCamera();
  document.getElementById('preview-img').src = 'data:image/jpeg;base64,' + currentImg64;
  document.getElementById('preview-wrap').style.display = 'block';
  document.getElementById('err-box').style.display = 'none';
  document.getElementById('form-wrap').style.display = 'none';
}

// ── GALLERY FALLBACK ──
function onGalleryFile(input){
  const f = input.files && input.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = e => {
    currentImg64 = e.target.result.split(',')[1];
    document.getElementById('preview-img').src = e.target.result;
    hideAll();
    document.getElementById('preview-wrap').style.display = 'block';
  };
  r.readAsDataURL(f);
  input.value = '';
}

// ── ANALYZE ──
async function analyze(){
  if(!currentImg64) return;
  hideAll();
  document.getElementById('spinner').style.display = 'block';

  const SYS = `Sos un extractor de datos de remitos argentinos. Devolvé ÚNICAMENTE JSON válido sin texto extra ni backticks:
{"numero":null,"fecha":null,"remitente":{"razon_social":null,"cuit":null,"localidad":null},"destinatario":{"razon_social":null,"cuit":null,"localidad":null},"transporte":{"nombre":null,"patente_camion":null,"patente_acoplado":null},"items":[],"observaciones":null}
Si un campo no está visible usar null. No inventar datos.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system: SYS,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:'image/jpeg',data:currentImg64}},
          {type:'text',text:'Extraé todos los datos de este remito.'}
        ]}]
      })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error?.message||'Error API');
    const raw = (data.content?.find(b=>b.type==='text')?.text||'').replace(/```json|```/g,'').trim();
    currentData = JSON.parse(raw);
    fillForm(currentData);
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('form-wrap').style.display = 'block';
    window.scrollTo(0, document.getElementById('form-wrap').offsetTop - 20);
  } catch(e) {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('preview-wrap').style.display = 'block';
    showErr('Error al analizar: ' + e.message);
  }
}

// ── FORM ──
function fillForm(d){
  document.getElementById('f-num').value = d.numero||'';
  document.getElementById('f-fecha').value = d.fecha||'';
  document.getElementById('f-rem-rs').value = d.remitente?.razon_social||'';
  document.getElementById('f-rem-cuit').value = d.remitente?.cuit||'';
  document.getElementById('f-rem-loc').value = d.remitente?.localidad||'';
  document.getElementById('f-dest-rs').value = d.destinatario?.razon_social||'';
  document.getElementById('f-dest-cuit').value = d.destinatario?.cuit||'';
  document.getElementById('f-dest-loc').value = d.destinatario?.localidad||'';
  document.getElementById('f-trans').value = d.transporte?.nombre||'';
  document.getElementById('f-pat-cam').value = d.transporte?.patente_camion||'';
  document.getElementById('f-pat-acop').value = d.transporte?.patente_acoplado||'';
  document.getElementById('f-obs').value = d.observaciones||'';
}

function readForm(){
  return {
    numero: document.getElementById('f-num').value.trim(),
    fecha: document.getElementById('f-fecha').value.trim(),
    remitente:{ razon_social:document.getElementById('f-rem-rs').value.trim(), cuit:document.getElementById('f-rem-cuit').value.trim(), localidad:document.getElementById('f-rem-loc').value.trim() },
    destinatario:{ razon_social:document.getElementById('f-dest-rs').value.trim(), cuit:document.getElementById('f-dest-cuit').value.trim(), localidad:document.getElementById('f-dest-loc').value.trim() },
    transporte:{ nombre:document.getElementById('f-trans').value.trim(), patente_camion:document.getElementById('f-pat-cam').value.trim(), patente_acoplado:document.getElementById('f-pat-acop').value.trim() },
    items: currentData?.items||[],
    observaciones: document.getElementById('f-obs').value.trim()
  };
}

// ── SAVE ──
function saveRemito(){
  const d = readForm();
  if(!d.numero && !d.remitente.razon_social){ toast('Completá al menos N° o remitente','err'); return; }
  remitos.unshift({ id:Date.now().toString(), ...d, _img64:currentImg64, _savedAt:new Date().toISOString(), _exported:false });
  save(); updateStats();
  currentImg64=null; currentData=null;
  hideAll();
  toast('✅ Remito guardado','ok');
  setTimeout(()=>showPage('list'), 700);
}

// ── LIST ──
function renderList(q){
  const c = document.getElementById('list-container');
  const list = q ? remitos.filter(r=>[r.numero,r.remitente?.razon_social,r.destinatario?.razon_social,r.transporte?.patente_camion,r.transporte?.nombre].some(v=>(v||'').toLowerCase().includes(q.toLowerCase()))) : remitos;
  if(!list.length){ c.innerHTML='<div class="empty">No hay remitos guardados</div>'; return; }
  c.innerHTML = list.map(r=>`
    <div class="card" onclick="openDetail('${r.id}')">
      <div class="card-num">N° ${r.numero||'Sin número'}</div>
      <div class="card-meta">${r.remitente?.razon_social||'Sin remitente'} · ${r.fecha||fmtDate(r._savedAt)}</div>
      ${r.transporte?.patente_camion?`<div class="card-meta">🚛 ${r.transporte.patente_camion}</div>`:''}
      <span class="badge ${r._exported?'exp':'pend'}">${r._exported?'Exportado':'Pendiente'}</span>
    </div>`).join('');
}
function filterList(q){ renderList(q); }

// ── DETAIL ──
function openDetail(id){
  const r = remitos.find(x=>x.id===id);
  if(!r) return;
  detailId=id;
  const row=(k,v)=>`<div class="detail-row"><span class="dk">${k}</span><span class="dv">${v||'-'}</span></div>`;
  document.getElementById('detail-container').innerHTML=`
    ${r._img64?`<img class="thumb" src="data:image/jpeg;base64,${r._img64}">`:''}
    <div class="detail-card">
      <div class="detail-title">Remito</div>
      ${row('N°',r.numero)}${row('Fecha',r.fecha)}
    </div>
    <div class="detail-card">
      <div class="detail-title">Remitente</div>
      ${row('Razón Social',r.remitente?.razon_social)}${row('CUIT',r.remitente?.cuit)}${row('Localidad',r.remitente?.localidad)}
    </div>
    <div class="detail-card">
      <div class="detail-title">Destinatario</div>
      ${row('Razón Social',r.destinatario?.razon_social)}${row('CUIT',r.destinatario?.cuit)}${row('Localidad',r.destinatario?.localidad)}
    </div>
    <div class="detail-card">
      <div class="detail-title">Transporte</div>
      ${row('Transportista',r.transporte?.nombre)}${row('Camión',r.transporte?.patente_camion)}${row('Acoplado',r.transporte?.patente_acoplado)}
    </div>
    ${r.observaciones?`<div class="detail-card"><div class="detail-title">Observaciones</div><div class="detail-row"><span class="dv" style="text-align:left">${r.observaciones}</span></div></div>`:''}
    <button class="btn btn-green" onclick="exportRemito('${r.id}')">⬇ Exportar para Rojosoft</button>
    <button class="btn btn-danger btn" onclick="deleteRemito('${r.id}')">Eliminar</button>
    <div style="height:32px"></div>`;
  showPage('detail');
}

// ── EXPORT ──
function exportRemito(id){
  const r=remitos.find(x=>x.id===id); if(!r) return;
  const lines=['TIPO;CAMPO;VALOR',
    `CAB;NUMERO;${r.numero||''}`,`CAB;FECHA;${r.fecha||''}`,
    `REM;RAZON_SOCIAL;${r.remitente?.razon_social||''}`,`REM;CUIT;${r.remitente?.cuit||''}`,`REM;LOCALIDAD;${r.remitente?.localidad||''}`,
    `DEST;RAZON_SOCIAL;${r.destinatario?.razon_social||''}`,`DEST;CUIT;${r.destinatario?.cuit||''}`,`DEST;LOCALIDAD;${r.destinatario?.localidad||''}`,
    `TRANS;NOMBRE;${r.transporte?.nombre||''}`,`TRANS;PATENTE_CAMION;${r.transporte?.patente_camion||''}`,`TRANS;PATENTE_ACOPLADO;${r.transporte?.patente_acoplado||''}`,
    ...(r.items||[]).flatMap((it,i)=>[`ITEM${i+1};DESCRIPCION;${it.descripcion||''}`,`ITEM${i+1};CANTIDAD;${it.cantidad||''}`,`ITEM${i+1};UNIDAD;${it.unidad||''}`]),
    r.observaciones?`OBS;TEXTO;${r.observaciones}`:null
  ].filter(Boolean).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([lines],{type:'text/plain'}));
  a.download=`remito_${r.numero||r.id}_rojosoft.txt`;
  a.click();
  r._exported=true; save();
  toast('📤 Archivo exportado','ok');
}

function deleteRemito(id){
  if(!confirm('¿Eliminar este remito?')) return;
  remitos=remitos.filter(x=>x.id!==id); save();
  toast('Eliminado','err'); showPage('list');
}

// ── HELPERS ──
function hideAll(){
  ['cam-wrap','preview-wrap','spinner','form-wrap','err-box'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.style.display='none';
  });
}
function showErr(msg){ const e=document.getElementById('err-box'); e.textContent=msg; e.style.display='block'; }
function updateStats(){
  document.getElementById('stat-total').textContent=remitos.length;
  document.getElementById('stat-exp').textContent=remitos.filter(r=>r._exported).length;
}
function fmtDate(iso){ try{ return new Date(iso).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit'}); }catch{ return ''; } }
let toastT;
function toast(msg,type){ const t=document.getElementById('toast'); t.textContent=msg; t.className='show '+type; clearTimeout(toastT); toastT=setTimeout(()=>t.className='',2500); }

// ── INIT ──
load(); updateStats();
</script>
</body>
</html>
