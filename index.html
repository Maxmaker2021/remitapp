<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RemitApp</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #0a0a0a; color: #f0f0f0; min-height: 100vh; }

  /* ── NAV ── */
  nav { display: flex; background: #141414; border-bottom: 1px solid #222; }
  nav button {
    flex: 1; padding: 14px 8px; background: none; border: none; border-bottom: 3px solid transparent;
    color: #888; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  nav button.active { color: #c8f060; border-bottom-color: #c8f060; }

  /* ── PAGES ── */
  .page { display: none; padding: 20px; }
  .page.active { display: block; }

  /* ── HOME ── */
  h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
  h1 span { color: #c8f060; }
  .sub { color: #888; font-size: 14px; margin-bottom: 28px; line-height: 1.5; }

  /* El truco: el label ES el botón, el input está adentro */
  .upload-label {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 18px;
    border-radius: 14px; font-size: 16px; font-weight: 700;
    cursor: pointer; margin-bottom: 12px;
  }
  .upload-label.primary { background: #c8f060; color: #0a0a0a; }
  .upload-label.secondary { background: #1e1e1e; color: #f0f0f0; border: 1px solid #333; }
  .upload-label input { display: none; }

  /* ── PREVIEW ── */
  #preview-section { display: none; margin-top: 20px; }
  #preview-img { width: 100%; border-radius: 12px; border: 1px solid #333; }
  .analyze-btn {
    width: 100%; padding: 16px; margin-top: 14px;
    background: #c8f060; color: #0a0a0a;
    border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .analyze-btn:disabled { opacity: .5; }

  /* ── SPINNER ── */
  #spinner { display: none; text-align: center; padding: 32px 0; }
  .ring {
    width: 48px; height: 48px; border-radius: 50%;
    border: 3px solid #333; border-top-color: #c8f060;
    animation: spin 1s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── RESULT FORM ── */
  #result-section { display: none; margin-top: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; color: #888; margin-bottom: 5px; letter-spacing: .05em; text-transform: uppercase; }
  .field input, .field textarea {
    width: 100%; padding: 12px 14px; background: #1e1e1e;
    border: 1px solid #333; border-radius: 10px; color: #f0f0f0; font-size: 14px;
  }
  .field textarea { resize: none; font-family: sans-serif; }
  .section-title { font-size: 12px; font-weight: 700; color: #555; letter-spacing: .1em; text-transform: uppercase; margin: 20px 0 10px; }
  .row { display: flex; gap: 10px; }
  .row .field { flex: 1; }
  .save-btn {
    width: 100%; padding: 16px; background: #60f0a8; color: #0a0a0a;
    border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px;
  }

  /* ── ERROR ── */
  .error-box { background: rgba(240,96,96,.1); border: 1px solid rgba(240,96,96,.3); border-radius: 10px; padding: 14px; color: #f06060; font-size: 13px; margin-top: 14px; display: none; }

  /* ── LIST ── */
  .search { width: 100%; padding: 12px 14px; background: #1e1e1e; border: 1px solid #333; border-radius: 10px; color: #f0f0f0; font-size: 14px; margin-bottom: 16px; }
  .remito-card { background: #141414; border: 1px solid #222; border-radius: 12px; padding: 16px; margin-bottom: 10px; cursor: pointer; }
  .remito-card:active { background: #1e1e1e; }
  .card-num { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .card-meta { font-size: 12px; color: #888; }
  .badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 100px; margin-top: 8px; }
  .badge.exp { background: rgba(200,240,96,.15); color: #c8f060; }
  .badge.pend { background: rgba(240,200,60,.1); color: #f0c83c; }
  .empty { text-align: center; padding: 48px 0; color: #555; font-size: 14px; }

  /* ── DETAIL ── */
  .detail-card { background: #141414; border: 1px solid #222; border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
  .detail-card-title { padding: 10px 16px; background: #1a1a1a; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #555; border-bottom: 1px solid #222; }
  .detail-row { display: flex; justify-content: space-between; padding: 11px 16px; border-bottom: 1px solid #1a1a1a; font-size: 13px; gap: 12px; }
  .detail-row:last-child { border-bottom: none; }
  .dk { color: #666; flex-shrink: 0; }
  .dv { color: #f0f0f0; text-align: right; }
  .thumb { width: 100%; border-radius: 12px; margin-bottom: 14px; border: 1px solid #222; }
  .exp-btn { width: 100%; padding: 15px; background: #60f0a8; color: #0a0a0a; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
  .del-btn { width: 100%; padding: 14px; background: none; color: #f06060; border: 1px solid rgba(240,96,96,.3); border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .back-btn { background: none; border: none; color: #888; font-size: 14px; cursor: pointer; margin-bottom: 16px; padding: 0; }

  /* ── TOAST ── */
  #toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(60px); background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 12px 20px; font-size: 13px; font-weight: 600; white-space: nowrap; transition: transform .3s, opacity .3s; opacity: 0; z-index: 999; }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast.ok { color: #c8f060; border-color: rgba(200,240,96,.3); }
  #toast.err { color: #f06060; border-color: rgba(240,96,96,.3); }
</style>
</head>
<body>

<nav>
  <button class="active" onclick="showPage('home')">📷 Escanear</button>
  <button onclick="showPage('list')">📋 Historial</button>
</nav>

<!-- ══ HOME ══ -->
<div class="page active" id="page-home">
  <br>
  <h1>Escaneá el <span>remito</span></h1>
  <p class="sub">Sacá una foto o subí una imagen del remito firmado.</p>

  <!-- CÁMARA: label envuelve al input, sin JS -->
  <label class="upload-label primary">
    📷 &nbsp;Fotografiar Remito
    <input type="file" accept="image/*" capture="environment" onchange="onFileChosen(this)">
  </label>

  <!-- GALERÍA: label envuelve al input, sin JS -->
  <label class="upload-label secondary">
    🖼️ &nbsp;Elegir desde galería
    <input type="file" accept="image/*" onchange="onFileChosen(this)">
  </label>

  <div id="preview-section">
    <img id="preview-img" src="" alt="Remito">
    <button class="analyze-btn" id="analyze-btn" onclick="analyze()">✨ Analizar con IA</button>
    <div class="error-box" id="error-box"></div>
  </div>

  <div id="spinner">
    <div class="ring"></div>
    <div style="color:#888;font-size:14px;">Claude está leyendo el remito…</div>
  </div>

  <div id="result-section">
    <div class="section-title">📄 Remito</div>
    <div class="row">
      <div class="field"><label>N° Remito</label><input id="f-num" type="text"></div>
      <div class="field"><label>Fecha</label><input id="f-fecha" type="text"></div>
    </div>

    <div class="section-title">🏭 Remitente</div>
    <div class="field"><label>Razón Social</label><input id="f-rem-rs" type="text"></div>
    <div class="row">
      <div class="field"><label>CUIT</label><input id="f-rem-cuit" type="text"></div>
      <div class="field"><label>Localidad</label><input id="f-rem-loc" type="text"></div>
    </div>

    <div class="section-title">📍 Destinatario</div>
    <div class="field"><label>Razón Social</label><input id="f-dest-rs" type="text"></div>
    <div class="row">
      <div class="field"><label>CUIT</label><input id="f-dest-cuit" type="text"></div>
      <div class="field"><label>Localidad</label><input id="f-dest-loc" type="text"></div>
    </div>

    <div class="section-title">🚛 Transporte</div>
    <div class="field"><label>Transportista</label><input id="f-trans" type="text"></div>
    <div class="row">
      <div class="field"><label>Patente Camión</label><input id="f-pat-cam" type="text"></div>
      <div class="field"><label>Patente Acoplado</label><input id="f-pat-acop" type="text"></div>
    </div>

    <div class="section-title">💬 Observaciones</div>
    <div class="field"><textarea id="f-obs" rows="3"></textarea></div>

    <button class="save-btn" onclick="saveRemito()">💾 Guardar Remito</button>
    <div style="height:40px"></div>
  </div>
</div>

<!-- ══ LIST ══ -->
<div class="page" id="page-list">
  <br>
  <input class="search" type="text" placeholder="Buscar por N°, empresa, patente…" oninput="filterList(this.value)">
  <div id="list-container"></div>
</div>

<!-- ══ DETAIL ══ -->
<div class="page" id="page-detail">
  <br>
  <button class="back-btn" onclick="showPage('list')">← Volver al historial</button>
  <div id="detail-container"></div>
</div>

<div id="toast"></div>

<script>
// ── STATE ──
const STORE_KEY = 'remitapp_v2';
let remitos = [];
let currentImg64 = null;
let currentImgMime = 'image/jpeg';
let currentData = null;
let detailId = null;

// ── STORAGE ──
function load() {
  try { remitos = JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch { remitos = []; }
}
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(remitos)); }

// ── NAV ──
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  const idx = ['home','list','detail'].indexOf(id);
  if (idx >= 0 && idx < 2) document.querySelectorAll('nav button')[idx].classList.add('active');
  if (id === 'list') renderList('');
  window.scrollTo(0,0);
}

// ── FILE CHOSEN ──
function onFileChosen(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  currentImgMime = file.type || 'image/jpeg';

  const reader = new FileReader();
  reader.onload = e => {
    currentImg64 = e.target.result.split(',')[1];
    document.getElementById('preview-img').src = e.target.result;
    document.getElementById('preview-section').style.display = 'block';
    document.getElementById('result-section').style.display = 'none';
    document.getElementById('error-box').style.display = 'none';
    document.getElementById('analyze-btn').disabled = false;
    window.scrollTo(0, document.getElementById('preview-section').offsetTop - 20);
  };
  reader.readAsDataURL(file);
  // reset input so same file can be re-selected
  input.value = '';
}

// ── ANALYZE ──
async function analyze() {
  if (!currentImg64) return;
  document.getElementById('preview-section').style.display = 'none';
  document.getElementById('spinner').style.display = 'block';
  document.getElementById('result-section').style.display = 'none';
  document.getElementById('error-box').style.display = 'none';

  const SYSTEM = `Sos un extractor de datos de remitos argentinos. Devolvé ÚNICAMENTE JSON válido sin texto extra ni backticks:
{"numero":null,"fecha":null,"remitente":{"razon_social":null,"cuit":null,"localidad":null},"destinatario":{"razon_social":null,"cuit":null,"localidad":null},"transporte":{"nombre":null,"patente_camion":null,"patente_acoplado":null},"items":[],"observaciones":null}
Si un campo no está visible, usar null. No inventar datos.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: currentImgMime, data: currentImg64 } },
            { type: 'text', text: 'Extraé todos los datos de este remito.' }
          ]
        }]
      })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || 'Error API');

    const raw = (data.content?.find(b => b.type === 'text')?.text || '').replace(/```json|```/g,'').trim();
    currentData = JSON.parse(raw);
    fillForm(currentData);

    document.getElementById('spinner').style.display = 'none';
    document.getElementById('result-section').style.display = 'block';
    window.scrollTo(0, document.getElementById('result-section').offsetTop - 20);

  } catch(e) {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('preview-section').style.display = 'block';
    const eb = document.getElementById('error-box');
    eb.textContent = 'Error: ' + e.message;
    eb.style.display = 'block';
  }
}

// ── FORM ──
function fillForm(d) {
  document.getElementById('f-num').value = d.numero || '';
  document.getElementById('f-fecha').value = d.fecha || '';
  document.getElementById('f-rem-rs').value = d.remitente?.razon_social || '';
  document.getElementById('f-rem-cuit').value = d.remitente?.cuit || '';
  document.getElementById('f-rem-loc').value = d.remitente?.localidad || '';
  document.getElementById('f-dest-rs').value = d.destinatario?.razon_social || '';
  document.getElementById('f-dest-cuit').value = d.destinatario?.cuit || '';
  document.getElementById('f-dest-loc').value = d.destinatario?.localidad || '';
  document.getElementById('f-trans').value = d.transporte?.nombre || '';
  document.getElementById('f-pat-cam').value = d.transporte?.patente_camion || '';
  document.getElementById('f-pat-acop').value = d.transporte?.patente_acoplado || '';
  document.getElementById('f-obs').value = d.observaciones || '';
}

function readForm() {
  return {
    numero: document.getElementById('f-num').value.trim(),
    fecha: document.getElementById('f-fecha').value.trim(),
    remitente: {
      razon_social: document.getElementById('f-rem-rs').value.trim(),
      cuit: document.getElementById('f-rem-cuit').value.trim(),
      localidad: document.getElementById('f-rem-loc').value.trim(),
    },
    destinatario: {
      razon_social: document.getElementById('f-dest-rs').value.trim(),
      cuit: document.getElementById('f-dest-cuit').value.trim(),
      localidad: document.getElementById('f-dest-loc').value.trim(),
    },
    transporte: {
      nombre: document.getElementById('f-trans').value.trim(),
      patente_camion: document.getElementById('f-pat-cam').value.trim(),
      patente_acoplado: document.getElementById('f-pat-acop').value.trim(),
    },
    items: currentData?.items || [],
    observaciones: document.getElementById('f-obs').value.trim(),
  };
}

// ── SAVE ──
function saveRemito() {
  const d = readForm();
  if (!d.numero && !d.remitente.razon_social) { toast('Completá al menos el N° o remitente', 'err'); return; }
  const r = { id: Date.now().toString(), ...d, _img64: currentImg64, _imgMime: currentImgMime, _savedAt: new Date().toISOString(), _exported: false };
  remitos.unshift(r);
  save();
  currentImg64 = null; currentData = null;
  document.getElementById('preview-section').style.display = 'none';
  document.getElementById('result-section').style.display = 'none';
  toast('✅ Remito guardado', 'ok');
  setTimeout(() => showPage('list'), 700);
}

// ── LIST ──
function renderList(q) {
  const c = document.getElementById('list-container');
  const filtered = q ? remitos.filter(r =>
    [r.numero, r.remitente?.razon_social, r.destinatario?.razon_social, r.transporte?.patente_camion, r.transporte?.nombre]
      .some(v => (v||'').toLowerCase().includes(q.toLowerCase()))
  ) : remitos;

  if (!filtered.length) { c.innerHTML = '<div class="empty">No hay remitos guardados</div>'; return; }

  c.innerHTML = filtered.map(r => `
    <div class="remito-card" onclick="openDetail('${r.id}')">
      <div class="card-num">N° ${r.numero || 'Sin número'}</div>
      <div class="card-meta">${r.remitente?.razon_social || 'Sin remitente'} · ${r.fecha || fmtDate(r._savedAt)}</div>
      <div class="card-meta">${r.transporte?.patente_camion ? '🚛 ' + r.transporte.patente_camion : ''}</div>
      <span class="badge ${r._exported ? 'exp' : 'pend'}">${r._exported ? 'Exportado' : 'Pendiente'}</span>
    </div>
  `).join('');
}

function filterList(q) { renderList(q); }

// ── DETAIL ──
function openDetail(id) {
  const r = remitos.find(x => x.id === id);
  if (!r) return;
  detailId = id;

  const rows = (obj, keys) => keys.map(([k,v]) =>
    `<div class="detail-row"><span class="dk">${k}</span><span class="dv">${v||'-'}</span></div>`
  ).join('');

  document.getElementById('detail-container').innerHTML = `
    ${r._img64 ? `<img class="thumb" src="data:${r._imgMime};base64,${r._img64}">` : ''}
    <div class="detail-card">
      <div class="detail-card-title">Remito</div>
      ${rows(r, [['N°', r.numero],['Fecha', r.fecha]])}
    </div>
    <div class="detail-card">
      <div class="detail-card-title">Remitente</div>
      ${rows(r, [['Razón Social', r.remitente?.razon_social],['CUIT', r.remitente?.cuit],['Localidad', r.remitente?.localidad]])}
    </div>
    <div class="detail-card">
      <div class="detail-card-title">Destinatario</div>
      ${rows(r, [['Razón Social', r.destinatario?.razon_social],['CUIT', r.destinatario?.cuit],['Localidad', r.destinatario?.localidad]])}
    </div>
    <div class="detail-card">
      <div class="detail-card-title">Transporte</div>
      ${rows(r, [['Transportista', r.transporte?.nombre],['Camión', r.transporte?.patente_camion],['Acoplado', r.transporte?.patente_acoplado]])}
    </div>
    ${r.observaciones ? `<div class="detail-card"><div class="detail-card-title">Observaciones</div><div class="detail-row"><span class="dv" style="text-align:left">${r.observaciones}</span></div></div>` : ''}
    <button class="exp-btn" onclick="exportRemito('${r.id}')">⬇ Exportar para Rojosoft</button>
    <button class="del-btn" onclick="deleteRemito('${r.id}')">Eliminar</button>
    <div style="height:32px"></div>
  `;

  showPage('detail');
}

// ── EXPORT ──
function exportRemito(id) {
  const r = remitos.find(x => x.id === id);
  if (!r) return;
  const lines = [
    'TIPO;CAMPO;VALOR',
    `CAB;NUMERO;${r.numero||''}`,
    `CAB;FECHA;${r.fecha||''}`,
    `REM;RAZON_SOCIAL;${r.remitente?.razon_social||''}`,
    `REM;CUIT;${r.remitente?.cuit||''}`,
    `REM;LOCALIDAD;${r.remitente?.localidad||''}`,
    `DEST;RAZON_SOCIAL;${r.destinatario?.razon_social||''}`,
    `DEST;CUIT;${r.destinatario?.cuit||''}`,
    `DEST;LOCALIDAD;${r.destinatario?.localidad||''}`,
    `TRANS;NOMBRE;${r.transporte?.nombre||''}`,
    `TRANS;PATENTE_CAMION;${r.transporte?.patente_camion||''}`,
    `TRANS;PATENTE_ACOPLADO;${r.transporte?.patente_acoplado||''}`,
    ...(r.items||[]).flatMap((it,i)=>[
      `ITEM${i+1};DESCRIPCION;${it.descripcion||''}`,
      `ITEM${i+1};CANTIDAD;${it.cantidad||''}`,
      `ITEM${i+1};UNIDAD;${it.unidad||''}`
    ]),
    r.observaciones ? `OBS;TEXTO;${r.observaciones}` : null
  ].filter(Boolean).join('\n');

  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines], {type:'text/plain'}));
  a.download = `remito_${r.numero||r.id}_rojosoft.txt`;
  a.click();

  r._exported = true;
  save();
  toast('📤 Archivo exportado', 'ok');
}

// ── DELETE ──
function deleteRemito(id) {
  if (!confirm('¿Eliminar este remito?')) return;
  remitos = remitos.filter(x => x.id !== id);
  save();
  toast('Remito eliminado', 'err');
  showPage('list');
}

// ── HELPERS ──
function fmtDate(iso) {
  try { return new Date(iso).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit'}); } catch { return ''; }
}

let toastT;
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show ' + type;
  clearTimeout(toastT);
  toastT = setTimeout(() => t.className = '', 2500);
}

// ── INIT ──
load();
</script>
</body>
</html>
